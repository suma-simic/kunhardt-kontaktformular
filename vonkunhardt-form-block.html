<div class="vk-form-wrap">
<form
  class="vk-form"
  action="https://forms.zohopublic.eu/vonkunhardtakademie/form/IhreAnfrageandievonKunhardtAkademie/formperma/bAH4HVvQq-fsCsFJejZ1_NeENddr9qVVLLzgHK8dRO4/htmlRecords/submit"
  name="form"
  method="POST"
  accept-charset="UTF-8"
  enctype="multipart/form-data"
  id="form">

  <input type="hidden" name="zf_referrer_name" value="">
  <input type="hidden" name="zf_redirect_url" value="">
  <input type="hidden" name="zc_gad" value="">

  <h2>Kontaktformular</h2>
  <p class="vk-desc">Schreiben Sie uns. Wir melden uns zeitnah persönlich bei Ihnen.</p>

  <div class="vk-field">
    <label for="vk-anrede">Anrede<span class="vk-req">*</span></label>
    <select id="vk-anrede" name="Dropdown" checktype="c1" required>
      <option value="-Select-">— auswählen —</option>
      <option value="Herr">Herr</option>
      <option value="Frau">Frau</option>
    </select>
    <p id="Dropdown_error" class="vk-error">Bitte Anrede auswählen.</p>
  </div>

  <div class="vk-field">
    <label>Vor- und Nachname<span class="vk-req">*</span></label>
    <div class="vk-row">
      <input type="text" name="Name_First" maxlength="255" fieldType="7" placeholder="Vorname" required>
      <input type="text" name="Name_Last" maxlength="255" fieldType="7" placeholder="Nachname" required>
    </div>
  </div>

  <div class="vk-field">
    <label for="vk-email">E-Mail-Adresse<span class="vk-req">*</span></label>
    <input id="vk-email" type="email" name="Email" checktype="c5" maxlength="255" fieldType="9" placeholder="ihre@email.de" required>
  </div>

  <div class="vk-field">
    <label for="vk-phone-number">Telefon<span class="vk-req">*</span></label>
    <div class="vk-phone-input">
      <select class="vk-phone-country select2-vk-native" name="PhoneNumber_countrycodeval" aria-label="Ländervorwahl" autocomplete="tel-country-code" required>
        <option value="+49" data-country="de" data-trunk-prefix="0" selected>🇩🇪 Deutschland +49</option>
        <option value="+43" data-country="at" data-trunk-prefix="0">🇦🇹 Österreich +43</option>
        <option value="+41" data-country="ch" data-trunk-prefix="0">🇨🇭 Schweiz +41</option>
        <option value="+32" data-country="be" data-trunk-prefix="0">🇧🇪 Belgien +32</option>
        <option value="+387" data-country="ba" data-trunk-prefix="0">🇧🇦 Bosnien und Herzegowina +387</option>
        <option value="+45" data-country="dk">🇩🇰 Dänemark +45</option>
        <option value="+33" data-country="fr" data-trunk-prefix="0">🇫🇷 Frankreich +33</option>
        <option value="+39" data-country="it">🇮🇹 Italien +39</option>
        <option value="+385" data-country="hr" data-trunk-prefix="0">🇭🇷 Kroatien +385</option>
        <option value="+423" data-country="li" data-trunk-prefix="0">🇱🇮 Liechtenstein +423</option>
        <option value="+352" data-country="lu">🇱🇺 Luxemburg +352</option>
        <option value="+31" data-country="nl" data-trunk-prefix="0">🇳🇱 Niederlande +31</option>
        <option value="+48" data-country="pl">🇵🇱 Polen +48</option>
        <option value="+421" data-country="sk" data-trunk-prefix="0">🇸🇰 Slowakei +421</option>
        <option value="+386" data-country="si" data-trunk-prefix="0">🇸🇮 Slowenien +386</option>
        <option value="+420" data-country="cz">🇨🇿 Tschechien +420</option>
        <option value="+36" data-country="hu" data-trunk-prefix="06">🇭🇺 Ungarn +36</option>
      </select>
      <span class="vk-phone-prefix" aria-hidden="true">
        <span class="vk-phone-flag" data-country="de"></span>
        <span class="vk-phone-code">+49</span>
      </span>
      <input id="vk-phone-number" class="form-control vk-phone-number" type="tel" name="PhoneNumber_countrycode" autocomplete="tel-national" maxlength="40" placeholder="Telefonnummer" required>
    </div>
  </div>

  <div class="vk-field">
    <label>Ich interessiere mich für<span class="vk-req">*</span> <span class="vk-optional">(Mehrfachauswahl)</span></label>
    <div class="vk-checkgrid" id="vk-checkgrid">
      <label><input type="checkbox" name="Checkbox" value="Ausbildung zum Business-Coach"> Ausbildung zum Business-Coach</label>
      <label><input type="checkbox" name="Checkbox" value="Ausbildung zum (Sport-)Mental-Coach"> Ausbildung zum (Sport-)Mental-Coach</label>
      <label><input type="checkbox" name="Checkbox" value="Speaker Skills / Rhetorik &amp; Bühnenpräsenz"> Speaker Skills, Rhetorik und Bühnenpräsenz</label>
      <label><input type="checkbox" name="Checkbox" value="Mentoring (persönliche Begleitung)"> Mentoring (persönliche Begleitung)</label>
      <label><input type="checkbox" name="Checkbox" value="Buchmentoring (eigenes Buch schreiben)"> Buchmentoring (eigenes Buch schreiben)</label>
      <label><input type="checkbox" name="Checkbox" value="Masterclass Mentalgiganten"> Masterclass „Mentalgiganten“</label>
      <label><input type="checkbox" name="Checkbox" value="Einzelcoaching / Persönliche Beratung"> Einzelcoaching / persönliche Beratung</label>
      <label><input type="checkbox" name="Checkbox" value="Keynote / Vortrag für mein Event"> Keynote / Vortrag für meine Veranstaltung</label>
      <label><input type="checkbox" name="Checkbox" value="Führungskräfte-Training (Unternehmen/Teams)"> Führungskräftetraining (Unternehmen und Teams)</label>
      <label><input type="checkbox" name="Checkbox" value="Achtsamkeit &amp; Stressmanagement"> Achtsamkeit und Stressmanagement</label>
      <label><input type="checkbox" name="Checkbox" value="Noch unklar / allgemeine Beratung"> Noch unklar / allgemeine Beratung</label>
    </div>
    <p id="Checkbox_error" class="vk-error">Bitte wählen Sie mindestens ein Thema aus.</p>
  </div>

  <div class="vk-field">
    <label for="vk-msg">Ihre Nachricht <span class="vk-optional">(optional)</span></label>
    <textarea id="vk-msg" name="MultiLine" maxlength="65535" placeholder="Ihr Anliegen, Ihre Frage oder eine kurze Vorstellung"></textarea>
  </div>

  <div class="vk-terms">
    <input id="vk-terms" type="checkbox" name="TermsConditions" required>
    <label for="vk-terms" style="margin:0; font-weight:400;">
      Ich habe die <a href="https://www.vonkunhardt.de/datenschutz/" target="_blank" rel="noopener noreferrer">Datenschutzerklärung</a> gelesen und bin damit einverstanden, dass meine Angaben zur Bearbeitung meiner Anfrage gespeichert und verarbeitet werden.<span class="vk-req">*</span>
    </label>
  </div>

  <button type="submit">Anfrage senden →</button>
</form>
</div>

<script>
(function(){
  var form = document.getElementById('form');
  if (!form) return;
  var grid = document.getElementById('vk-checkgrid');
  var errorMsg = document.getElementById('Checkbox_error');
  if (!grid || !errorMsg) return;
  function checkedCount(){ return grid.querySelectorAll('input[type="checkbox"]:checked').length; }
  function clearError(){ grid.classList.remove('vk-invalid'); errorMsg.style.display = 'none'; }
  grid.addEventListener('change', clearError);
  form.addEventListener('submit', function(e){
    if (checkedCount() === 0) {
      e.preventDefault();
      e.stopPropagation();
      grid.classList.add('vk-invalid');
      errorMsg.style.display = 'block';
      grid.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  });
})();

(() => {
  const phone = document.getElementById('vk-phone-number');
  if (!phone || !phone.form) return;

  const form = phone.form;
  const country = form.elements.namedItem('PhoneNumber_countrycodeval');
  const field = country.closest('.vk-phone-input');
  const flag = field.querySelector('.vk-phone-flag');
  const code = field.querySelector('.vk-phone-code');
  const countryOptions = Array.from(country.options);
  const phoneFormat = /^\+?[0-9\s().-]+$/;

  function renderCountry() {
    const selected = country.selectedOptions[0];
    flag.dataset.country = selected.dataset.country;
    code.textContent = selected.value;
  }

  function splitPhone(value) {
    const compact = value.replace(/[\s().-]/g, '').replace(/^00/, '+');
    const option = countryOptions.find((item) => compact.startsWith(item.value));
    return { option, number: option ? compact.slice(option.value.length) : compact };
  }

  renderCountry();
  field.classList.add('vk-phone-ready');

  country.addEventListener('change', () => {
    phone.setCustomValidity('');
    renderCountry();
  });

  phone.addEventListener('input', (event) => {
    phone.setCustomValidity('');
    const typed = phone.value.trim();
    if (event.isComposing || !phoneFormat.test(typed)) return;

    const { option, number } = splitPhone(typed);
    if (option) {
      country.value = option.value;
      renderCountry();
      phone.value = number;
    }
  });

  form.addEventListener('submit', (event) => {
    if (event.defaultPrevented) return;

    const typed = phone.value.trim();
    const { option, number } = splitPhone(typed);
    let message = '';

    if (!phoneFormat.test(typed)) {
      message = 'Bitte geben Sie eine gültige Telefonnummer ein.';
    } else if (!option && number.startsWith('+')) {
      message = 'Bitte verwenden Sie eine Ländervorwahl aus der Auswahlliste.';
    }

    // Nur die nationale Verkehrsausscheidungsziffer des gewählten Landes abtrennen.
    const { trunkPrefix } = (option || country.selectedOptions[0]).dataset;
    const national = trunkPrefix && number.startsWith(trunkPrefix) ? number.slice(trunkPrefix.length) : number;
    if (!message && !/^[0-9]{5,15}$/.test(national)) {
      message = 'Bitte geben Sie nach der Ländervorwahl 5 bis 15 Ziffern ein.';
    }

    if (message) {
      event.preventDefault();
      phone.setCustomValidity(message);
      phone.reportValidity();
      return;
    }

    if (option) {
      country.value = option.value;
      renderCountry();
    }
    phone.value = national;
  });

  window.addEventListener('pageshow', renderCountry);
})();
</script>
